<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生年表メモリー</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: #f2f2f7;
  color: #1c1c1e;
}

#app {
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  background: #ffffff;
  display: flex;
  flex-direction: column;
}

.page {
  display: none;
  flex-direction: column;
  flex: 1;
  padding: 20px;
}

.page.active {
  display: flex;
}

h1 {
  font-size: 22px;
  text-align: center;
  margin: 24px 0 8px;
}

h2 {
  font-size: 20px;
  margin: 0;
}

.lead {
  text-align: center;
  color: #6e6e73;
  font-size: 14px;
  margin: 0 0 24px;
}

.btn {
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.btn:active {
  opacity: 0.7;
}

.btn-primary {
  background: #007aff;
  color: #fff;
}

.btn-secondary {
  background: #e5e5ea;
  color: #1c1c1e;
}

.btn-edit {
  background: #34c759;
  color: #fff;
  font-size: 14px;
  padding: 8px 14px;
  flex-shrink: 0;
}

.top-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.top-form label {
  font-size: 14px;
  color: #6e6e73;
}

.top-form input {
  font-size: 16px;
  padding: 12px;
  border: 1px solid #c7c7cc;
  border-radius: 10px;
}

.top-form .btn {
  margin-top: 8px;
}

.top-load-section {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #e5e5ea;
  display: flex;
  justify-content: center;
}

.message {
  color: #ff3b30;
  text-align: center;
  font-size: 14px;
  min-height: 18px;
}

.career-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}

.career-header-buttons {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.career-header-buttons .btn {
  padding: 9px 12px;
  font-size: 14px;
  white-space: nowrap;
}

.save-status {
  text-align: center;
  color: #34c759;
  font-size: 14px;
  min-height: 18px;
  margin: 4px 0 12px;
}

.career-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}

.career-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.career-year-label {
  width: 54px;
  flex-shrink: 0;
  font-weight: 600;
  font-size: 15px;
}

.career-input {
  flex: 1;
  min-width: 0;
  font-size: 16px;
  padding: 10px;
  border: 1px solid #c7c7cc;
  border-radius: 10px;
}

.career-input::placeholder {
  color: #c7c7cc;
}

.year-row1 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid #e5e5ea;
}

.year-label {
  font-size: 26px;
  font-weight: 700;
}

.year-row2 {
  padding: 18px 0;
  border-bottom: 1px solid #e5e5ea;
}

.year-career-display {
  font-size: 18px;
  min-height: 24px;
}

.year-row3 {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding-top: 18px;
  flex: 1;
}

.year-comment {
  width: 100%;
  font-size: 16px;
  padding: 12px;
  border: 1px solid #c7c7cc;
  border-radius: 10px;
  resize: none;
  overflow: hidden;
  min-height: 90px;
  font-family: inherit;
}

#year-back-btn {
  margin-top: 12px;
}
</style>
</head>
<body>

<div id="app">

  <!-- トップページ -->
  <section id="page-top" class="page">
    <h1>人生年表メモリー</h1>
    <p class="lead">生まれた年を入力すると、その年から今年までの年表ページを作成します。</p>
    <div class="top-form">
      <label for="birth-year-input">生まれた年(西暦)</label>
      <input type="number" id="birth-year-input" placeholder="例: 1990" inputmode="numeric">
      <button id="execute-btn" class="btn btn-primary">実行</button>
    </div>
    <div class="top-load-section">
      <button id="load-data-btn" class="btn btn-secondary">データ読み込み</button>
      <input type="file" id="csv-file-input" accept=".csv,text/csv" hidden>
    </div>
    <p id="top-message" class="message"></p>
  </section>

  <!-- 経歴ページ -->
  <section id="page-career" class="page">
    <header class="career-header">
      <h2>経歴</h2>
      <div class="career-header-buttons">
        <button id="career-save-btn" class="btn btn-primary">保存</button>
        <button id="career-csv-export-btn" class="btn btn-secondary">CSV出力</button>
      </div>
    </header>
    <p id="career-save-status" class="save-status" aria-live="polite"></p>
    <div id="career-list" class="career-list"></div>
  </section>

  <!-- 年別ページ -->
  <section id="page-year" class="page">
    <div class="year-row1">
      <div id="year-label" class="year-label"></div>
      <button id="year-save-btn" class="btn btn-primary">保存</button>
    </div>
    <div class="year-row2">
      <div id="year-career-display" class="year-career-display"></div>
    </div>
    <div class="year-row3">
      <textarea id="year-comment" class="year-comment" placeholder="コメントを自由に入力..." rows="1"></textarea>
      <button id="year-back-btn" class="btn btn-secondary">戻る</button>
    </div>
    <p id="year-save-status" class="save-status" aria-live="polite"></p>
  </section>

</div>

<script>
const STORAGE_KEY = 'lifeTimelineData';
let currentYearViewing = null;

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getCurrentYear() {
  return new Date().getFullYear();
}

function initYears(birthYear) {
  const data = loadData() || {};
  data.birthYear = birthYear;
  data.initialized = true;
  data.years = data.years || {};
  const currentYear = getCurrentYear();
  for (let y = birthYear; y <= currentYear; y++) {
    if (!data.years[y]) {
      data.years[y] = { career: '', comment: '' };
    }
  }
  saveData(data);
  return data;
}

function showPage(id) {
  document.querySelectorAll('.page').forEach((el) => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function route() {
  const hash = location.hash || '#top';
  const data = loadData();

  if (hash === '#career') {
    if (!data || !data.initialized) {
      location.hash = '#top';
      return;
    }
    renderCareerPage(data);
    showPage('page-career');
  } else if (hash.indexOf('#year-') === 0) {
    const year = hash.slice('#year-'.length);
    if (!data || !data.initialized || !data.years[year]) {
      location.hash = '#career';
      return;
    }
    renderYearPage(data, year);
    showPage('page-year');
  } else {
    prefillTopPage(data);
    showPage('page-top');
  }
}

function prefillTopPage(data) {
  const input = document.getElementById('birth-year-input');
  if (data && data.birthYear) {
    input.value = data.birthYear;
  }
}

function onExecute() {
  const input = document.getElementById('birth-year-input');
  const messageEl = document.getElementById('top-message');
  const currentYear = getCurrentYear();
  const year = parseInt(input.value, 10);

  if (!input.value.trim() || isNaN(year) || year < 1900 || year > currentYear) {
    messageEl.textContent = `生まれた年を1900〜${currentYear}の範囲で正しく入力してください。`;
    return;
  }

  messageEl.textContent = '';
  const data = loadData();
  if (!data || !data.initialized) {
    initYears(year);
  }
  location.hash = '#career';
}

function renderCareerPage(data) {
  const listEl = document.getElementById('career-list');
  listEl.innerHTML = '';

  const years = Object.keys(data.years).map(Number).sort((a, b) => a - b);
  years.forEach((year) => {
    const row = document.createElement('div');
    row.className = 'career-row';

    const yearLabel = document.createElement('div');
    yearLabel.className = 'career-year-label';
    yearLabel.textContent = `${year}年`;

    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'btn btn-edit';
    editBtn.textContent = '編集';
    editBtn.addEventListener('click', () => {
      location.hash = `#year-${year}`;
    });

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'career-input';
    input.placeholder = '学歴・社歴';
    input.value = data.years[year].career || '';
    input.dataset.year = String(year);

    row.appendChild(yearLabel);
    row.appendChild(input);
    row.appendChild(editBtn);
    listEl.appendChild(row);
  });
}

function onCareerSave() {
  const data = loadData();
  if (!data) return;

  document.querySelectorAll('.career-input').forEach((input) => {
    const year = input.dataset.year;
    if (data.years[year]) {
      data.years[year].career = input.value;
    }
  });

  saveData(data);
  flashStatus('career-save-status', '保存しました');
}

function renderYearPage(data, year) {
  currentYearViewing = year;
  const yearData = data.years[year];

  document.getElementById('year-label').textContent = `${year}年`;
  document.getElementById('year-career-display').textContent = yearData.career || '';

  const commentEl = document.getElementById('year-comment');
  commentEl.value = yearData.comment || '';
  autoResizeTextarea(commentEl);
}

function onYearSave() {
  if (!currentYearViewing) return;
  const data = loadData();
  if (!data || !data.years[currentYearViewing]) return;

  const commentEl = document.getElementById('year-comment');
  data.years[currentYearViewing].comment = commentEl.value;
  saveData(data);
  flashStatus('year-save-status', '保存しました');
}

function getTodayDateString() {
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  return `${yyyy}${mm}${dd}`;
}

function csvEscapeField(value) {
  const str = String(value ?? '');
  if (/[",\n\r]/.test(str)) {
    return `"${str.replace(/"/g, '""')}"`;
  }
  return str;
}

function buildCsv(data) {
  const rows = [['年', '学歴・社歴', 'コメント']];
  const years = Object.keys(data.years).map(Number).sort((a, b) => a - b);
  years.forEach((year) => {
    const yearData = data.years[year];
    rows.push([year, yearData.career || '', yearData.comment || '']);
  });
  return rows.map((row) => row.map(csvEscapeField).join(',')).join('\r\n');
}

function onCsvExport() {
  const data = loadData();
  if (!data || !data.years) return;

  const csvBody = buildCsv(data);
  const blob = new Blob(['\uFEFF' + csvBody], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const filename = `${getTodayDateString()}_読込用データ.csv`;

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCsv(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (inQuotes) {
      if (char === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = false;
        }
      } else {
        field += char;
      }
    } else if (char === '"') {
      inQuotes = true;
    } else if (char === ',') {
      row.push(field);
      field = '';
    } else if (char === '\n') {
      row.push(field);
      rows.push(row);
      row = [];
      field = '';
    } else if (char === '\r') {
      if (text[i + 1] !== '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      }
    } else {
      field += char;
    }
  }
  if (field !== '' || row.length > 0) {
    row.push(field);
    rows.push(row);
  }
  return rows.filter((r) => !(r.length === 1 && r[0] === ''));
}

function onCsvFileSelected(event) {
  const fileInput = event.target;
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;

  const messageEl = document.getElementById('top-message');
  const reader = new FileReader();

  reader.onload = () => {
    try {
      const text = String(reader.result || '').replace(/^\uFEFF/, '');
      const rows = parseCsv(text);
      if (rows.length < 2) throw new Error('no data rows');

      const years = {};
      let minYear = null;
      rows.slice(1).forEach((r) => {
        const year = parseInt(r[0], 10);
        if (isNaN(year)) return;
        years[year] = { career: r[1] || '', comment: r[2] || '' };
        if (minYear === null || year < minYear) minYear = year;
      });
      if (minYear === null) throw new Error('no valid year rows');

      const data = initYears(minYear);
      Object.keys(years).forEach((y) => {
        data.years[y] = years[y];
      });
      saveData(data);

      messageEl.textContent = '';
      location.hash = '#career';
    } catch (e) {
      messageEl.textContent = 'CSVファイルの読み込みに失敗しました。ファイル形式を確認してください。';
    } finally {
      fileInput.value = '';
    }
  };
  reader.onerror = () => {
    messageEl.textContent = 'ファイルの読み込みに失敗しました。';
    fileInput.value = '';
  };
  reader.readAsText(file, 'utf-8');
}

function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = `${el.scrollHeight}px`;
}

function flashStatus(elId, message) {
  const el = document.getElementById(elId);
  el.textContent = message;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => {
    el.textContent = '';
  }, 2000);
}

window.addEventListener('hashchange', route);

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('execute-btn').addEventListener('click', onExecute);
  document.getElementById('load-data-btn').addEventListener('click', () => {
    document.getElementById('csv-file-input').click();
  });
  document.getElementById('csv-file-input').addEventListener('change', onCsvFileSelected);
  document.getElementById('career-save-btn').addEventListener('click', onCareerSave);
  document.getElementById('career-csv-export-btn').addEventListener('click', onCsvExport);
  document.getElementById('year-save-btn').addEventListener('click', onYearSave);
  document.getElementById('year-back-btn').addEventListener('click', () => {
    location.hash = '#career';
  });
  document.getElementById('year-comment').addEventListener('input', (e) => {
    autoResizeTextarea(e.target);
  });

  route();
});
</script>
</body>
</html>
