<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>サイン取得アプリ</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f2f2f2; }
  button { font-family: inherit; cursor: pointer; }
  button[disabled] { opacity: .5; }

  .screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
  .screen.active { display: flex; }

  header.topbar { display: flex; gap: 8px; padding: 8px 10px; background: #fff; border-bottom: 1px solid #ddd; align-items: center; }
  .btn-small { flex: 0 0 auto; padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px; background: #607d8b; color: #fff; }
  .btn-small.primary { background: #2e7d32; }

  main { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; }
  h1 { font-size: 18px; margin: 0 0 16px; }

  .btn-big { display: block; width: 100%; padding: 16px; margin-bottom: 12px; font-size: 17px; border: none; border-radius: 10px; color: #fff; }
  #btn-save-external { background: #1565c0; }
  #btn-open { background: #2e7d32; }
  #btn-delete { background: #c62828; }

  label.field-label { font-size: 14px; color: #555; margin: 8px 0 6px; }
  textarea#comment { flex: 1; min-height: 140px; width: 100%; padding: 10px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; resize: vertical; }
  select#sign-size { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; margin-bottom: 8px; }

  .canvas-wrap { flex: 1; position: relative; background: #fff; margin: 10px; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
  canvas#sign-canvas { width: 100%; height: 100%; display: block; touch-action: none; background: #fff; }

  .preview-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #fff; margin: 10px; border: 1px solid #ccc; border-radius: 8px; overflow: auto; }
  .preview-wrap img { max-width: 100%; }

  .a4-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; background: #ddd; padding: 10px; }
  .a4-wrap img { width: 100%; max-width: 480px; box-shadow: 0 1px 4px rgba(0,0,0,.3); background: #fff; }

  .hint { font-size: 12px; color: #777; text-align: center; padding: 6px 16px 12px; margin: 0; }
</style>
</head>
<body>

  <!-- 画面1: トップ画面 -->
  <div id="screen-home" class="screen active">
    <main>
      <h1>サイン取得アプリ</h1>
      <button id="btn-save-external" class="btn-big">外部へ保存</button>
      <button id="btn-open" class="btn-big">開く</button>
      <button id="btn-delete" class="btn-big">削除</button>
      <label class="field-label" for="comment">コメント</label>
      <textarea id="comment" placeholder="コメントを入力してください"></textarea>
      <label class="field-label" for="sign-size">サインサイズ</label>
      <select id="sign-size">
        <option value="large">大きい</option>
        <option value="standard" selected>標準</option>
        <option value="small">小さい</option>
      </select>
    </main>
  </div>

  <!-- 画面2: サイン記入画面 -->
  <div id="screen-sign" class="screen">
    <header class="topbar">
      <button id="btn-sign-save" class="btn-small primary">保存</button>
      <button id="btn-sign-close" class="btn-small">閉じる</button>
    </header>
    <div class="canvas-wrap">
      <canvas id="sign-canvas"></canvas>
    </div>
  </div>

  <!-- 画面3: サインのコピー/プレビュー画面 -->
  <div id="screen-preview" class="screen">
    <header class="topbar">
      <button id="btn-preview-back" class="btn-small">戻る</button>
      <button id="btn-preview-redo" class="btn-small">再記入</button>
    </header>
    <div class="preview-wrap">
      <img id="sign-preview-img" alt="サイン">
    </div>
  </div>

  <!-- 画面4: PDF保存前の確認画面 -->
  <div id="screen-confirm" class="screen">
    <header class="topbar">
      <button id="btn-confirm-back" class="btn-small">戻る</button>
      <button id="btn-confirm-save" class="btn-small primary">保存</button>
    </header>
    <div class="a4-wrap">
      <img id="confirm-img" alt="保存内容(A4)">
    </div>
    <p class="hint">A4サイズのPDFとして保存します。対応ブラウザでは保存先フォルダ(documents等)を選択できます。未対応の場合はダウンロードフォルダに保存されます。</p>
  </div>

<script>
(function () {
  'use strict';

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  // ---- elements ----
  var commentEl = document.getElementById('comment');
  var signSizeEl = document.getElementById('sign-size');
  var btnSaveExternal = document.getElementById('btn-save-external');
  var btnOpen = document.getElementById('btn-open');
  var btnDelete = document.getElementById('btn-delete');

  var canvas = document.getElementById('sign-canvas');
  var sctx = canvas.getContext('2d');
  var btnSignSave = document.getElementById('btn-sign-save');
  var btnSignClose = document.getElementById('btn-sign-close');

  var previewImg = document.getElementById('sign-preview-img');
  var btnPreviewBack = document.getElementById('btn-preview-back');
  var btnPreviewRedo = document.getElementById('btn-preview-redo');

  var confirmImg = document.getElementById('confirm-img');
  var btnConfirmBack = document.getElementById('btn-confirm-back');
  var btnConfirmSave = document.getElementById('btn-confirm-save');

  // ---- state ----
  var signatureDataURL = null; // 画面2で書いたサインのみ(ボタン部分は含まない)
  var drawing = false;
  var hasDrawn = false;
  var pendingPdfBytes = null;
  var pendingFilename = '';

  // ---- 画面2: 手書きサイン ----
  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.lineWidth = 3;
    sctx.lineCap = 'round';
    sctx.lineJoin = 'round';
    sctx.strokeStyle = '#000';
  }

  function clearCanvas() {
    sctx.save();
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.clearRect(0, 0, canvas.width, canvas.height);
    sctx.restore();
  }

  function resetSignScreen() {
    clearCanvas();
    hasDrawn = false;
    drawing = false;
  }

  function resetPreviewScreen() {
    signatureDataURL = null;
    previewImg.src = '';
  }

  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', function (e) {
    drawing = true;
    var p = getPos(e);
    sctx.beginPath();
    sctx.moveTo(p.x, p.y);
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = getPos(e);
    sctx.lineTo(p.x, p.y);
    sctx.stroke();
    hasDrawn = true;
    e.preventDefault();
  });
  function stopDrawing() { drawing = false; }
  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);
  window.addEventListener('resize', function () {
    if (document.getElementById('screen-sign').classList.contains('active')) {
      resizeCanvas();
    }
  });

  // ---- 画面遷移 ----
  btnOpen.addEventListener('click', function () {
    showScreen('screen-sign');
    requestAnimationFrame(resizeCanvas);
  });

  btnDelete.addEventListener('click', function () {
    if (!signatureDataURL && !hasDrawn) return;
    if (window.confirm('サインを削除します。よろしいですか？')) {
      resetSignScreen();
      resetPreviewScreen();
    }
  });

  btnSignSave.addEventListener('click', function () {
    if (!hasDrawn) {
      alert('サインが入力されていません。');
      return;
    }
    signatureDataURL = canvas.toDataURL('image/png');
    previewImg.src = signatureDataURL;
    resetSignScreen();
    showScreen('screen-preview');
  });

  btnSignClose.addEventListener('click', function () {
    resetSignScreen();
    showScreen('screen-home');
  });

  btnPreviewBack.addEventListener('click', function () {
    showScreen('screen-home');
  });

  btnPreviewRedo.addEventListener('click', function () {
    resetSignScreen();
    resetPreviewScreen();
    showScreen('screen-sign');
    requestAnimationFrame(resizeCanvas);
  });

  btnConfirmBack.addEventListener('click', function () {
    showScreen('screen-home');
  });

  // ---- テキスト折り返し(日本語は文字単位、それ以外は単語単位) ----
  function wrapText(ctx, text, maxWidth) {
    var paragraphs = String(text || '').split('\n');
    var lines = [];
    paragraphs.forEach(function (para) {
      if (para === '') { lines.push(''); return; }
      var words = para.split(' ');
      var current = '';
      words.forEach(function (word) {
        var test = current ? current + ' ' + word : word;
        if (ctx.measureText(test).width <= maxWidth) {
          current = test;
        } else {
          if (current) lines.push(current);
          if (ctx.measureText(word).width <= maxWidth) {
            current = word;
          } else {
            var chunk = '';
            for (var i = 0; i < word.length; i++) {
              var t2 = chunk + word[i];
              if (ctx.measureText(t2).width <= maxWidth) {
                chunk = t2;
              } else {
                if (chunk) lines.push(chunk);
                chunk = word[i];
              }
            }
            current = chunk;
          }
        }
      });
      if (current) lines.push(current);
    });
    return lines;
  }

  var COMPOSE_DPI = 150;
  var SIGN_SIZE_MULTIPLIERS = { large: 1, standard: 0.5, small: 0.125 };

  // ---- サイン+コメントをページ1枚分のCanvasに合成 ----
  // コメントあり: A4縦、サイン上半分+コメント下半分
  // コメントなし: A5横、サイン全面
  // サインサイズ(大きい/標準/小さい)は、上記の領域いっぱいに収まる大きさ
  // (=大きい)を基準に、縦横ともにその1倍/0.5倍/0.125倍で中央配置する
  function composeSignaturePage(signatureSrc, commentText, sizeOption) {
    return new Promise(function (resolve) {
      var hasComment = !!(commentText && commentText.trim() !== '');
      var pageWmm = 210;
      var pageHmm = hasComment ? 297 : 148;
      var wPx = Math.round(pageWmm / 25.4 * COMPOSE_DPI);
      var hPx = Math.round(pageHmm / 25.4 * COMPOSE_DPI);
      var margin = Math.round(15 / 25.4 * COMPOSE_DPI);
      var dateAreaHeight = 60;

      var page = document.createElement('canvas');
      page.width = wPx;
      page.height = hPx;
      var pctx = page.getContext('2d');
      pctx.fillStyle = '#fff';
      pctx.fillRect(0, 0, wPx, hPx);

      var img = new Image();
      img.onload = function () {
        var sigBoxX = margin, sigBoxY = margin, sigBoxW, sigBoxH;
        if (hasComment) {
          var halfH = hPx / 2;
          sigBoxW = wPx - margin * 2;
          sigBoxH = halfH - margin * 1.5;
        } else {
          sigBoxW = wPx - margin * 2;
          sigBoxH = hPx - margin * 2 - dateAreaHeight;
        }

        var fitScale = Math.min(sigBoxW / img.width, sigBoxH / img.height, 1);
        var sizeMultiplier = SIGN_SIZE_MULTIPLIERS[sizeOption] || 1;
        var scale = fitScale * sizeMultiplier;
        var dw = img.width * scale;
        var dh = img.height * scale;
        var dx = sigBoxX + (sigBoxW - dw) / 2;
        var dy = sigBoxY + (sigBoxH - dh) / 2;

        pctx.strokeStyle = '#ccc';
        pctx.strokeRect(sigBoxX, sigBoxY, sigBoxW, sigBoxH);
        pctx.drawImage(img, dx, dy, dw, dh);

        if (hasComment) {
          var maxW = wPx - margin * 2;
          var textTop = hPx / 2 + margin / 2;
          pctx.fillStyle = '#000';
          pctx.font = '28px sans-serif';
          var lineHeight = 40;
          var lines = wrapText(pctx, commentText, maxW);
          var y = textTop + 28;
          for (var i = 0; i < lines.length && y <= hPx - margin - dateAreaHeight; i++) {
            pctx.fillText(lines[i], margin, y);
            y += lineHeight;
          }
        }

        pctx.textAlign = 'right';
        pctx.font = '24px sans-serif';
        pctx.fillStyle = '#000';
        pctx.fillText(formatDateTime(new Date()), wPx - margin, hPx - margin);
        pctx.textAlign = 'left';

        resolve(page);
      };
      img.src = signatureSrc;
    });
  }

  // ---- 最小PDFビルダー(外部ライブラリ・通信不要、オフラインで完結) ----
  function dataURLToBytes(dataURL) {
    var base64 = dataURL.split(',')[1];
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function buildPDF(jpegBytes, widthPx, heightPx, pw, ph) {
    var encoder = new TextEncoder();
    var chunks = [];
    var offset = 0;
    var objOffsets = {};

    function push(part) {
      var bytes = (typeof part === 'string') ? encoder.encode(part) : part;
      chunks.push(bytes);
      offset += bytes.length;
    }

    push('%PDF-1.4\n');

    objOffsets[1] = offset;
    push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

    objOffsets[2] = offset;
    push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');

    objOffsets[3] = offset;
    push('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph +
      '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');

    objOffsets[4] = offset;
    push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + widthPx +
      ' /Height ' + heightPx + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
      jpegBytes.length + ' >>\nstream\n');
    push(jpegBytes);
    push('\nendstream\nendobj\n');

    var content = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q';
    objOffsets[5] = offset;
    push('5 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');

    var xrefOffset = offset;
    var xref = 'xref\n0 6\n0000000000 65535 f \n';
    for (var i = 1; i <= 5; i++) {
      xref += String(objOffsets[i]).padStart(10, '0') + ' 00000 n \n';
    }
    push(xref);
    push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF');

    var total = 0;
    chunks.forEach(function (c) { total += c.length; });
    var result = new Uint8Array(total);
    var pos = 0;
    chunks.forEach(function (c) { result.set(c, pos); pos += c.length; });
    return result;
  }

  // ファイル名: 日付(年月日) + "サイン取得"(固定) + コメント先頭5文字(空なら無し)
  function buildFilename(commentText) {
    var d = new Date();
    function p(n) { return String(n).padStart(2, '0'); }
    var datePart = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
    var cleaned = String(commentText || '').replace(/[\r\n\t\\/:*?"<>|]/g, '').trim();
    var commentPart = cleaned ? cleaned.slice(0, 5) : '';
    return datePart + 'サイン取得' + commentPart + '.pdf';
  }

  function formatDateTime(d) {
    function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // ---- 画面1: 外部へ保存 -> 確認画面(画面4)を表示 ----
  btnSaveExternal.addEventListener('click', function () {
    if (!signatureDataURL) {
      alert('サインがありません。「開く」からサインを入力してください。');
      return;
    }
    composeSignaturePage(signatureDataURL, commentEl.value, signSizeEl.value).then(function (page) {
      var jpegDataURL = page.toDataURL('image/jpeg', 0.92);
      confirmImg.src = jpegDataURL;
      var jpegBytes = dataURLToBytes(jpegDataURL);
      var pwPt = page.width * 72 / COMPOSE_DPI;
      var phPt = page.height * 72 / COMPOSE_DPI;
      pendingPdfBytes = buildPDF(jpegBytes, page.width, page.height, pwPt, phPt);
      pendingFilename = buildFilename(commentEl.value);
      showScreen('screen-confirm');
    });
  });

  async function savePDF(bytes, filename) {
    var blob = new Blob([bytes], { type: 'application/pdf' });
    if (window.showSaveFilePicker) {
      try {
        var handle = await window.showSaveFilePicker({
          suggestedName: filename,
          startIn: 'documents',
          types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }]
        });
        var writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return true;
      } catch (err) {
        if (err && err.name === 'AbortError') return false;
        // 未対応環境などはダウンロードへフォールバック
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  }

  btnConfirmSave.addEventListener('click', async function () {
    if (!pendingPdfBytes) return;
    btnConfirmSave.disabled = true;
    try {
      var saved = await savePDF(pendingPdfBytes, pendingFilename);
      if (saved) {
        showScreen('screen-home');
      }
    } catch (err) {
      alert('保存に失敗しました: ' + err.message);
    } finally {
      btnConfirmSave.disabled = false;
    }
  });
})();
</script>
</body>
</html>
